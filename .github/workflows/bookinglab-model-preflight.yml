name: BookingLab Model Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENCODE_VERSION: 1.18.31

jobs:
  qwen35:
    name: Qwen3.5-122B-A10B
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check NVIDIA API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail

          cat > /tmp/request.json <<'JSON'
          {
            "model": "qwen/qwen3.5-122b-a10b",
            "messages": [
              {
                "role": "user",
                "content": "Reply with exactly: QWEN35_API_OK"
              }
            ],
            "chat_template_kwargs": {
              "enable_thinking": false
            },
            "temperature": 0.7,
            "top_p": 0.8,
            "max_tokens": 16,
            "stream": false
          }
          JSON

          status="$(
            curl --http1.1 \
              --connect-timeout 10 \
              --max-time 90 \
              -sS \
              -o /tmp/response.json \
              -w '%{http_code}' \
              -X POST \
              "${NVIDIA_BASE_URL}/chat/completions" \
              -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary @/tmp/request.json
          )"

          echo "HTTP status: ${status}"
          cat /tmp/response.json

          if [ "${status}" != "200" ]; then
            echo "::error::Qwen3.5 NVIDIA API failed with HTTP ${status}"
            exit 1
          fi

          if ! grep -q "QWEN35_API_OK" /tmp/response.json; then
            echo "::error::Qwen3.5 API marker not found"
            exit 1
          fi

          echo "QWEN35_API_OK"

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: OpenCode integration test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail

          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/qwen/qwen3.5-122b-a10b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "qwen3.5-122b-a10b": {
                    "name": "qwen/qwen3.5-122b-a10b",
                    "limit": {
                      "context": 262144,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

          timeout 240s opencode run \
            --model nvidia/qwen/qwen3.5-122b-a10b \
            --print-logs \
            "You are performing a read-only BookingLab preflight test. Do not edit files. Reply with exactly: QWEN35_OPENCODE_OK"

      - name: Cleanup
        if: always()
        run: rm -f opencode.json /tmp/request.json /tmp/response.json

  nemotron-super:
    name: Nemotron 3 Super 120B A12B
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check NVIDIA API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail

          cat > /tmp/request.json <<'JSON'
          {
            "model": "nvidia/nemotron-3-super-120b-a12b",
            "messages": [
              {
                "role": "user",
                "content": "Reply with exactly: NEMOTRON_SUPER_API_OK"
              }
            ],
            "chat_template_kwargs": {
              "enable_thinking": false
            },
            "temperature": 1.0,
            "top_p": 0.95,
            "max_tokens": 16,
            "stream": false
          }
          JSON

          status="$(
            curl --http1.1 \
              --connect-timeout 10 \
              --max-time 90 \
              -sS \
              -o /tmp/response.json \
              -w '%{http_code}' \
              -X POST \
              "${NVIDIA_BASE_URL}/chat/completions" \
              -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data-binary @/tmp/request.json
          )"

          echo "HTTP status: ${status}"
          cat /tmp/response.json

          if [ "${status}" != "200" ]; then
            echo "::error::Nemotron Super NVIDIA API failed with HTTP ${status}"
            exit 1
          fi

          if ! grep -q "NEMOTRON_SUPER_API_OK" /tmp/response.json; then
            echo "::error::Nemotron Super API marker not found"
            exit 1
          fi

          echo "NEMOTRON_SUPER_API_OK"

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: OpenCode integration test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail

          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-super-120b-a12b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-super-120b-a12b": {
                    "name": "nvidia/nemotron-3-super-120b-a12b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

          timeout 240s opencode run \
            --model nvidia/nvidia/nemotron-3-super-120b-a12b \
            --print-logs \
            "You are performing a read-only BookingLab preflight test. Do not edit files. Reply with exactly: NEMOTRON_SUPER_OPENCODE_OK"

      - name: Cleanup
        if: always()
        run: rm -f opencode.json /tmp/request.json /tmp/response.json
