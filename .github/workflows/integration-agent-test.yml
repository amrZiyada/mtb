name: BookingLab Integration Agent

on:
  workflow_dispatch:
    inputs:
      source_run_number:
        description: "Successful 4-Agent workflow run number"
        required: true
        type: string
        default: "17"

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  integration:
    name: Integration Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve source workflow run ID
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_NUMBER: ${{ inputs.source_run_number }}
        run: |
          echo "========================================"
          echo "RESOLVING SOURCE WORKFLOW RUN"
          echo "========================================"

          echo "Requested Run Number:"
          echo "$SOURCE_RUN_NUMBER"

          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/multi-agent-cloud-test.yml/runs?event=workflow_dispatch&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number == ${SOURCE_RUN_NUMBER}) | .id" \
            | head -1)

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Successful source run not found."
            exit 1
          fi

          echo
          echo "Source Run Number:"
          echo "$SOURCE_RUN_NUMBER"

          echo
          echo "Actual Run ID:"
          echo "$RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Show integration context
        run: |
          echo "========================================"
          echo "BOOKINGLAB INTEGRATION AGENT"
          echo "========================================"

          echo "Source Run:"
          echo "${{ inputs.source_run_number }}"

          echo
          echo "Source Run ID:"
          echo "${{ steps.source.outputs.run_id }}"

          echo
          echo "Current branch:"
          git branch --show-current

          echo
          echo "Main commit:"
          git log -1 --oneline

          echo "========================================"

      - name: Download all agent artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify four agent patches
        run: |
          echo "========================================"
          echo "VERIFYING AGENT PATCHES"
          echo "========================================"

          find artifacts -type f -name "*.patch" -print

          PATCH_COUNT=$(find artifacts -type f -name "*.patch" | wc -l)

          echo
          echo "Patch count: $PATCH_COUNT"

          if [ "$PATCH_COUNT" -ne 4 ]; then
            echo "ERROR: Expected exactly 4 patches."
            exit 1
          fi

          echo
          echo "All 4 patches found."

      - name: Create integration branch
        run: |
          BRANCH="cloud-agent/integration-${{ inputs.source_run_number }}-${{ github.run_id }}"

          echo "Integration branch:"
          echo "$BRANCH"

          git switch -c "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Apply Agent 1 patch
        run: |
          PATCH=$(find artifacts -path "*Agent 1*" -name "*.patch" -type f | head -1)

          test -n "$PATCH"

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Apply Agent 2 patch
        run: |
          PATCH=$(find artifacts -path "*Agent 2*" -name "*.patch" -type f | head -1)

          test -n "$PATCH"

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Apply Agent 3 patch
        run: |
          PATCH=$(find artifacts -path "*Agent 3*" -name "*.patch" -type f | head -1)

          test -n "$PATCH"

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Apply Agent 4 patch
        run: |
          PATCH=$(find artifacts -path "*Agent 4*" -name "*.patch" -type f | head -1)

          test -n "$PATCH"

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Verify integrated files
        run: |
          echo "========================================"
          echo "VERIFYING INTEGRATED FILES"
          echo "========================================"

          git diff --name-only

          EXPECTED_FILES="
          api/src/index.ts
          web/app/dashboard/page.tsx
          web/app/admin/page.tsx
          web/app/page.tsx
          "

          ACTUAL=$(git diff --name-only)

          for FILE in \
            "api/src/index.ts" \
            "web/app/dashboard/page.tsx" \
            "web/app/admin/page.tsx" \
            "web/app/page.tsx"
          do
            if ! printf '%s\n' "$ACTUAL" | grep -Fxq "$FILE"; then
              echo "ERROR: Missing expected file: $FILE"
              exit 1
            fi
          done

          UNEXPECTED=$(printf '%s\n' "$ACTUAL" | grep -Ev \
            '^(api/src/index\.ts|web/app/dashboard/page\.tsx|web/app/admin/page\.tsx|web/app/page\.tsx)$' \
            || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "ERROR: Unexpected files:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo
          echo "Exactly four BookingLab files changed."

      - name: Install API dependencies
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Web dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate API TypeScript
        working-directory: api
        run: |
          echo "========================================"
          echo "API VALIDATION"
          echo "========================================"

          npm exec --no -- tsc --version
          npm exec --no -- tsc --noEmit

          echo "API validation PASSED."

      - name: Validate Web TypeScript
        working-directory: web
        run: |
          echo "========================================"
          echo "WEB VALIDATION"
          echo "========================================"

          npm exec --no -- tsc --version
          npm exec --no -- tsc --noEmit

          echo "Web validation PASSED."

      - name: Final diff check
        run: |
          echo "========================================"
          echo "FINAL DIFF CHECK"
          echo "========================================"

          git diff --check

          echo
          git diff --stat

          echo
          echo "Changed files:"
          git diff --name-only

      - name: Commit integrated changes
        run: |
          echo "========================================"
          echo "CREATING INTEGRATION COMMIT"
          echo "========================================"

          git config user.name "BookingLab Cloud Integration Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            api/src/index.ts \
            web/app/dashboard/page.tsx \
            web/app/admin/page.tsx \
            web/app/page.tsx

          git commit \
            -m "chore: integrate BookingLab cloud agents"

          echo
          echo "Created commit:"
          git log -1 --oneline

      - name: Push integration branch
        run: |
          echo "========================================"
          echo "PUSHING INTEGRATION BRANCH"
          echo "========================================"

          git push --set-upstream origin "$branch"

          echo
          echo "Branch pushed:"
          echo "$branch"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "CREATING PULL REQUEST"
          echo "========================================"

          PR_URL=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: integrate BookingLab cloud agents" \
            --body "$(cat <<'EOF'
          ## BookingLab Cloud Agent Integration

          This PR was created automatically by the BookingLab Integration Agent.

          ### Source
          - 4-agent cloud coding run: #${{ inputs.source_run_number }}

          ### Agents
          - Agent 1 — Nemotron 3 Ultra 550B — API
          - Agent 2 — GLM-5.3 — Dashboard
          - Agent 3 — Nemotron 3 Ultra 550B — Admin
          - Agent 4 — GLM-5.3 — Public

          ### Validation
          - All 4 agent patches downloaded successfully
          - All 4 patches applied successfully
          - Strict file isolation verified
          - API TypeScript validation passed
          - Web TypeScript validation passed
          - `git diff --check` passed

          ### Safety
          - No direct changes were made to `main`
          - Changes are isolated in this branch
          - Human review is required before merge
          EOF
          )")

          echo
          echo "Pull Request:"
          echo "$PR_URL"

          echo "pr_url=$PR_URL" >> "$GITHUB_ENV"

      - name: Final result
        run: |
          echo "========================================"
          echo "BOOKINGLAB CLOUD INTEGRATION COMPLETE"
          echo "========================================"

          echo
          echo "Source Run:"
          echo "#${{ inputs.source_run_number }}"

          echo
          echo "Integration Branch:"
          echo "$branch"

          echo
          echo "Pull Request:"
          echo "$pr_url"

          echo
          echo "MAIN WAS NOT MODIFIED."
          echo "========================================"
