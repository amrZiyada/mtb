name: BookingLab Integration Agent Test

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful 4-Agent workflow run ID"
        required: true
        type: string
        default: "17"

permissions:
  contents: read
  actions: read

jobs:
  integration:
    name: Integration Agent
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Show integration context
        run: |
          echo "========================================"
          echo "BOOKINGLAB INTEGRATION AGENT"
          echo "========================================"
          echo "Source workflow run: ${{ inputs.source_run_id }}"
          echo
          echo "Base branch:"
          git branch --show-current
          echo
          echo "Base commit:"
          git log -1 --oneline
          echo "========================================"

      - name: Download Agent 1 patch
        uses: actions/download-artifact@v5
        with:
          name: Agent 1 - Nemotron - API-patch
          path: artifacts/agent1
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Agent 2 patch
        uses: actions/download-artifact@v5
        with:
          name: Agent 2 - GLM-5.3 - Dashboard-patch
          path: artifacts/agent2
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Agent 3 patch
        uses: actions/download-artifact@v5
        with:
          name: Agent 3 - Nemotron - Admin-patch
          path: artifacts/agent3
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Agent 4 patch
        uses: actions/download-artifact@v5
        with:
          name: Agent 4 - GLM-5.3 - Public-patch
          path: artifacts/agent4
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect downloaded artifacts
        run: |
          echo "========================================"
          echo "DOWNLOADED PATCHES"
          echo "========================================"

          find artifacts -type f -maxdepth 3 -print

          echo
          echo "Patch sizes:"
          find artifacts -type f -name "*.patch" -exec ls -lh {} \;

      - name: Create integration branch
        run: |
          git switch -c cloud-test/integration-agent

          echo "Integration branch:"
          git branch --show-current

      - name: Apply Agent 1 patch
        run: |
          PATCH=$(find artifacts/agent1 -name "*.patch" -type f | head -1)

          if [ -z "$PATCH" ]; then
            echo "ERROR: Agent 1 patch not found"
            exit 1
          fi

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Apply Agent 2 patch
        run: |
          PATCH=$(find artifacts/agent2 -name "*.patch" -type f | head -1)

          if [ -z "$PATCH" ]; then
            echo "ERROR: Agent 2 patch not found"
            exit 1
          fi

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Apply Agent 3 patch
        run: |
          PATCH=$(find artifacts/agent3 -name "*.patch" -type f | head -1)

          if [ -z "$PATCH" ]; then
            echo "ERROR: Agent 3 patch not found"
            exit 1
          fi

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Apply Agent 4 patch
        run: |
          PATCH=$(find artifacts/agent4 -name "*.patch" -type f | head -1)

          if [ -z "$PATCH" ]; then
            echo "ERROR: Agent 4 patch not found"
            exit 1
          fi

          echo "Applying:"
          echo "$PATCH"

          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Verify integrated diff
        run: |
          echo "========================================"
          echo "INTEGRATED DIFF"
          echo "========================================"

          git status --short

          echo
          echo "Changed files:"
          git diff --name-only

          EXPECTED="
          api/src/index.ts
          web/app/dashboard/page.tsx
          web/app/admin/page.tsx
          web/app/page.tsx
          "

          ACTUAL=$(git diff --name-only)

          for FILE in \
            "api/src/index.ts" \
            "web/app/dashboard/page.tsx" \
            "web/app/admin/page.tsx" \
            "web/app/page.tsx"
          do
            if ! printf '%s\n' "$ACTUAL" | grep -Fxq "$FILE"; then
              echo "ERROR: Expected file missing: $FILE"
              exit 1
            fi
          done

          echo
          echo "All 4 expected files are present."

      - name: Verify no unexpected tracked files changed
        run: |
          echo "========================================"
          echo "STRICT FILE CHECK"
          echo "========================================"

          UNEXPECTED=$(git diff --name-only | grep -Ev \
            '^(api/src/index\.ts|web/app/dashboard/page\.tsx|web/app/admin/page\.tsx|web/app/page\.tsx)$' \
            || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "ERROR: Unexpected files changed:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo "Only the four assigned BookingLab files changed."

      - name: Install API dependencies
        working-directory: api
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Web dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate API TypeScript
        working-directory: api
        run: |
          echo "========================================"
          echo "API TYPESCRIPT VALIDATION"
          echo "========================================"

          npm exec --no -- tsc --version
          npm exec --no -- tsc --noEmit

      - name: Validate Web TypeScript
        working-directory: web
        run: |
          echo "========================================"
          echo "WEB TYPESCRIPT VALIDATION"
          echo "========================================"

          npm exec --no -- tsc --version
          npm exec --no -- tsc --noEmit

      - name: Show final integrated diff
        run: |
          echo "========================================"
          echo "FINAL INTEGRATED DIFF"
          echo "========================================"

          git diff --stat

          echo
          git diff --check

          echo
          echo "Integration test completed successfully."

      - name: Create integration artifact
        run: |
          git diff > integrated-bookinglab.patch

          echo "Created integrated patch:"
          ls -lh integrated-bookinglab.patch

      - name: Upload integrated patch
        uses: actions/upload-artifact@v6
        with:
          name: BookingLab-integrated-patch
          path: integrated-bookinglab.patch
          if-no-files-found: error
