name: BookingLab Real Task - 4 Cloud Agents v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-api:
    name: Agent 1 - Nemotron API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.31

      - name: Run Nemotron API agent
        timeout-minutes: 10
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          AGENT_PROMPT: |
            You are Agent 1 for the BookingLab production project.

            Assigned file:
            api/src/index.ts

            TASK:
            Audit the patient-address persistence flow for reservation edits.

            Required behavior:
            - Existing address must remain unchanged when an edit does not supply address.
            - A supplied new address must be persisted.
            - Existing API contracts must remain intact.
            - Do not change authentication or authorization.
            - Do not change commissions.
            - Do not change original_total.
            - Do not change assignment rules.
            - Do not change editing permissions.
            - Reservation statuses remain exactly:
              PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
            - There is NO CANCELLED status.

            IMPORTANT:
            Inspect the current implementation first.
            If the current implementation already satisfies the requirements,
            make NO source-code change and finish successfully.
            Do not invent a refactor.

            Validation:
            cd api && npm exec --no -- tsc --noEmit

            Git rules:
            - Only api/src/index.ts may be modified.
            - If a source change is needed, commit it.
            - Commit message:
              fix: preserve booking address during edits
            - Do not push.
            - Do not create a PR.
            - Do not deploy.
        run: |
          git checkout -b cloud-task/api-nemotron
          set +e
          timeout 8m opencode run \
            --model "nvidia/nvidia/nemotron-3-ultra-550b-a55b" \
            --print-logs \
            "$AGENT_PROMPT"
          AGENT_EXIT=$?
          echo "AGENT_EXIT=$AGENT_EXIT" >> "$GITHUB_ENV"
          exit 0

      - name: Validate API and allow one repair
        timeout-minutes: 5
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
        run: |
          set +e

          cd api
          npm exec --no -- tsc --noEmit
          TSC_EXIT=$?
          cd ..

          if [ "$TSC_EXIT" -ne 0 ]; then
            echo "Initial TypeScript validation failed. One repair attempt allowed."

            export REPAIR_PROMPT='
            Repair ONLY api/src/index.ts.

            The previous agent produced a TypeScript validation failure.

            Fix ONLY the actual TypeScript errors.
            Do not refactor unrelated code.
            Do not change authentication, authorization, commissions,
            original_total, assignment rules, editing permissions,
            or reservation statuses.

            Statuses must remain:
            PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE

            There is NO CANCELLED status.

            Run:
            cd api && npm exec --no -- tsc --noEmit

            Commit the fix with:
            fix: repair API TypeScript validation

            Do not push, create a PR, or deploy.
            '

            timeout 4m opencode run \
              --model "nvidia/nvidia/nemotron-3-ultra-550b-a55b" \
              --print-logs \
              "$REPAIR_PROMPT"

            cd api
            npm exec --no -- tsc --noEmit
            TSC_EXIT=$?
            cd ..
          fi

          if [ "$TSC_EXIT" -ne 0 ]; then
            echo "API validation failed after the single repair attempt."
            exit "$TSC_EXIT"
          fi

          echo "API validation passed."

      - name: Verify assigned file
        run: |
          CHANGED=$(git diff --name-only HEAD)
          echo "$CHANGED"

          for file in $CHANGED; do
            test "$file" = "api/src/index.ts"
          done

      - name: Create patch artifact
        run: |
          if git diff --quiet HEAD; then
            echo "NO_CHANGE" > agent.noop
          else
            git diff HEAD -- api/src/index.ts > agent.patch
            test -s agent.patch
          fi

      - name: Upload API result
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-real-api-nemotron
          path: |
            agent.patch
            agent.noop
          if-no-files-found: ignore


