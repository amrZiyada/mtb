        run: |
          set -euo pipefail

          rm -f tsconfig.tsbuildinfo

          timeout 150s npm exec --no -- tsc \
            --noEmit \
            --incremental false

      - name: Clean generated files
        run: |
          set -euo pipefail
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true

      - name: Verify Admin scope and create artifact
        timeout-minutes: 2
        run: |
          set -euo pipefail

          ASSIGNED="web/app/admin/page.tsx"

          TRACKED_CHANGED="$(git diff --name-only "$BASE_SHA")"
          UNTRACKED_CHANGED="$(git ls-files --others --exclude-standard)"

          echo "Tracked changes:"
          printf '%s\n' "$TRACKED_CHANGED"

          echo "Untracked files:"
          printf '%s\n' "$UNTRACKED_CHANGED"

          BAD_TRACKED="$(
            printf '%s\n' "$TRACKED_CHANGED" |
            sed '/^$/d' |
            grep -vxF "$ASSIGNED" || true
          )"

          if [ -n "$BAD_TRACKED" ]; then
            echo "ERROR: Agent changed files outside assigned scope:"
            printf '%s\n' "$BAD_TRACKED"
            exit 1
          fi

          if [ -n "$UNTRACKED_CHANGED" ]; then
            echo "ERROR: Agent created unexpected untracked files:"
            printf '%s\n' "$UNTRACKED_CHANGED"
            exit 1
          fi

          if git diff --quiet "$BASE_SHA" -- "$ASSIGNED"; then
            echo "NO_CHANGE" > agent.noop
            echo "Agent 3: NO CHANGE"
          else
            git diff "$BASE_SHA" -- "$ASSIGNED" > agent.patch
            test -s agent.patch
            echo "Agent 3: PATCH CREATED"
