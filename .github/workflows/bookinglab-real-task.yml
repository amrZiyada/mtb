name: BookingLab Real Task - 4 Cloud Agents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-api:
    name: Agent 1 - Nemotron API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.31

      - name: Configure NVIDIA
        run: |
          echo "NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1" >> "$GITHUB_ENV"

      - name: Create agent branch
        run: |
          git checkout -b cloud-task/api-nemotron

      - name: Run Nemotron API agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          opencode run \
            --model "nvidia/nvidia/nemotron-3-ultra-550b-a55b" \
            --print-logs \
            "$(cat <<'PROMPT'
You are Agent 1 for the BookingLab production project.

You are working ONLY on:
api/src/index.ts

REAL TASK:
Audit and improve the BookingLab patient-address persistence flow.

Requirements:
1. Patient address must be preserved when an existing reservation is edited.
2. If the edit payload does not contain address, the existing address must remain unchanged.
3. If the edit payload explicitly supplies a new address, the new address must be persisted.
4. Do not change reservation status workflow:
   PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
   There is NO CANCELLED status.
5. Do not change authentication or authorization rules.
6. Do not change commission calculations.
7. Do not change original_total behavior.
8. Do not change reservation ownership/editing permissions.
9. Preserve existing API contracts and database behavior.
10. Make the smallest safe production-quality change necessary.
11. Inspect the current implementation before changing anything.
12. If the current implementation already satisfies the requirements, do not make unrelated changes.

Validation:
cd api && npm exec --no -- tsc --noEmit

Git rules:
- Modify ONLY api/src/index.ts.
- Commit ONLY that file.
- Commit message:
  fix: preserve booking address during edits
- Do NOT push.
- Do NOT create a PR.
- Do NOT deploy.
PROMPT
)"

      - name: Verify assigned file
        run: |
          git diff --name-only HEAD~1 HEAD
          test "$(git diff --name-only HEAD~1 HEAD)" = "api/src/index.ts"

      - name: Create patch
        run: |
          git format-patch -1 HEAD --stdout > agent.patch
          test -s agent.patch

      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-real-api-nemotron
          path: agent.patch


  agent-dashboard:
    name: Agent 2 - GLM Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.31

      - name: Configure NVIDIA
        run: |
          echo "NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1" >> "$GITHUB_ENV"

      - name: Create agent branch
        run: |
          git checkout -b cloud-task/dashboard-glm

      - name: Run GLM Dashboard agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          opencode run \
            --model "nvidia/z-ai/glm-5.3" \
            --print-logs \
            "$(cat <<'PROMPT'
You are Agent 2 for the BookingLab production project.

You are working ONLY on:
web/app/dashboard/page.tsx

REAL TASK:
Improve the staff dashboard reservation editing UI so patient address is handled consistently.

Requirements:
1. When a staff user opens an editable reservation, the current patient address must be visible.
2. The address must be editable where the existing reservation editing rules allow editing.
3. Saving the reservation must send the address together with the existing editable patient fields.
4. Do not change status transitions.
5. Do not change permissions.
6. Do not change commission calculations.
7. Do not change test pricing or original_total behavior.
8. Do not alter the intentional rule that assigned DOCTOR/REP may edit CONFIRMED reservations when the existing permission allows it.
9. Do not introduce a new reservation status.
10. Preserve the existing UI style and responsive behavior.
11. Inspect the current implementation before modifying it.
12. Make the smallest safe production-quality change.

Validation:
cd web && npm exec --no -- tsc --noEmit

Git rules:
- Modify ONLY web/app/dashboard/page.tsx.
- Commit ONLY that file.
- Commit message:
  fix: preserve patient address in staff editing
- Do NOT push.
- Do NOT create a PR.
- Do NOT deploy.
PROMPT
)"

      - name: Verify assigned file
        run: |
          git diff --name-only HEAD~1 HEAD
          test "$(git diff --name-only HEAD~1 HEAD)" = "web/app/dashboard/page.tsx"

      - name: Create patch
        run: |
          git format-patch -1 HEAD --stdout > agent.patch
          test -s agent.patch

      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-real-dashboard-glm
          path: agent.patch


