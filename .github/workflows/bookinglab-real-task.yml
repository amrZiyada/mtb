name: BookingLab Real Task

on:
  workflow_dispatch:

concurrency:
  group: bookinglab-real-task
  cancel-in-progress: false

permissions:
  contents: write

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENCODE_VERSION: 1.18.31
  OPENCODE_MODEL: nvidia/nvidia/nemotron-3-ultra-550b-a55b

jobs:

  api-agent:
    name: Agent 1 - API - Nemotron Ultra
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
      AGENT_PROMPT: |
        You are Agent 1 for the BookingLab production repository.

        ONLY modify:
        api/src/index.ts

        Do not modify any other file.
        Do not create files.
        Do not commit or push.

        TASK:
        Implement and verify the pending BookingLab reservation edit/details consistency work in api/src/index.ts.

        Requirements:
        1. Preserve all existing authentication, authorization, CSRF, rate limiting, session handling and validation.
        2. Status workflow remains exactly:
           PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
           There is NO CANCELLED status.
        3. Preserve original_total after reservation creation. Editing must not overwrite historical original_total.
        4. Authorized reservation edits must correctly handle:
           patient_name, age, gender, phone, address, preferred_at.
        5. Address supplied by an authorized edit must persist.
        6. Preserve original selected tests separately from extra tests.
        7. Do not alter commission rules.
        8. Preserve staff edit restrictions and finalized-record protection.
        9. Preserve admin privileges.
        10. Inspect existing code first and make the smallest safe production-quality changes.
        11. Run the relevant TypeScript check.

        Actually edit api/src/index.ts. Do not merely describe changes.
        At the end, print a short summary and validation result.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Nemotron Ultra
        run: |
          set -euo pipefail
          timeout 720s opencode run             --model "${OPENCODE_MODEL}"             --print-logs             "${AGENT_PROMPT}"

      - name: Clean generated files and validate scope
        run: |
          set -euo pipefail
          rm -f opencode.json
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true

          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^api/src/index.ts$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::API agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: api
        run: npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- api/src/index.ts > /tmp/api-agent.patch
          test -s /tmp/api-agent.patch

      - name: Upload API patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-api-patch
          path: /tmp/api-agent.patch
          retention-days: 1


  dashboard-agent:
    name: Agent 2 - Dashboard - Nemotron Ultra
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
      AGENT_PROMPT: |
        You are Agent 2 for the BookingLab production repository.

        ONLY modify:
        web/app/dashboard/page.tsx

        Do not modify any other file.
        Do not create files.
        Do not commit or push.

        TASK:
        Bring the staff dashboard reservation details/edit UI into consistency with the current BookingLab reservation model and API.

        Requirements:
        1. Preserve staff authentication, sessions, roles and permissions.
        2. Staff must only edit data authorized by the API.
        3. Reservation details must display address when present.
        4. Edit must correctly load/save:
           patient_name, age, gender, phone, address, preferred_at.
        5. Preserve original selected tests separately from extra tests.
        6. Preserve original test metadata when already available. Do not invent data.
        7. Preserve all existing status behavior.
        8. Preserve the authorized assigned DOCTOR/REP CONFIRMED-edit permission.
        9. Do not change commissions.
        10. Preserve responsive/mobile behavior.
        11. Make the smallest safe production-quality changes.
        12. Run the relevant TypeScript check.

        Actually edit web/app/dashboard/page.tsx. Do not merely describe changes.
        At the end, print a short summary and validation result.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Nemotron Ultra
        run: |
          set -euo pipefail
          timeout 720s opencode run             --model "${OPENCODE_MODEL}"             --print-logs             "${AGENT_PROMPT}"

      - name: Clean generated files and validate scope
        run: |
          set -euo pipefail
          rm -f opencode.json
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true

          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^web/app/dashboard/page.tsx$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Dashboard agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- web/app/dashboard/page.tsx > /tmp/dashboard-agent.patch
          test -s /tmp/dashboard-agent.patch

      - name: Upload Dashboard patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-dashboard-patch
          path: /tmp/dashboard-agent.patch
          retention-days: 1


  admin-agent:
    name: Agent 3 - Admin - Nemotron Ultra
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
      AGENT_PROMPT: |
        You are Agent 3 for the BookingLab production repository.

        ONLY modify:
        web/app/admin/page.tsx

        Do not modify any other file.
        Do not create files.
        Do not commit or push.

        TASK:
        Bring the admin reservation details/edit UI into consistency with the current BookingLab reservation model and API.

        Requirements:
        1. Preserve admin authentication and authorization.
        2. Admin retains existing reservation editing privileges subject to finalized-record protection.
        3. Reservation details must display address when present.
        4. Edit must correctly load/save:
           patient_name, age, gender, phone, address, preferred_at.
        5. Preserve original_total. Historical original pricing must not be recalculated by patient-data editing.
        6. Preserve original selected tests separately from extra tests.
        7. Display existing original test metadata without inventing values.
        8. Preserve status workflow exactly:
           PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        9. There is NO CANCELLED status.
        10. Preserve assignment and role restrictions.
        11. Do not change commissions.
        12. Preserve responsive/mobile behavior.
        13. Make the smallest safe production-quality changes.
        14. Run the relevant TypeScript check.

        Actually edit web/app/admin/page.tsx. Do not merely describe changes.
        At the end, print a short summary and validation result.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Nemotron Ultra
        run: |
          set -euo pipefail
          timeout 720s opencode run             --model "${OPENCODE_MODEL}"             --print-logs             "${AGENT_PROMPT}"

      - name: Clean generated files and validate scope
        run: |
          set -euo pipefail
          rm -f opencode.json
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true

          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^web/app/admin/page.tsx$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Admin agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- web/app/admin/page.tsx > /tmp/admin-agent.patch
          test -s /tmp/admin-agent.patch

      - name: Upload Admin patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-admin-patch
          path: /tmp/admin-agent.patch
          retention-days: 1


  public-agent:
    name: Agent 4 - Public Booking - Nemotron Ultra
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
      AGENT_PROMPT: |
        You are Agent 4 for the BookingLab production repository.

        ONLY modify:
        web/app/page.tsx

        Do not modify any other file.
        Do not create files.
        Do not commit or push.

        TASK:
        Bring the public booking flow into consistency with the current BookingLab reservation test model.

        Requirements:
        1. Preserve test search behavior. Do not preload the complete test catalog.
        2. Preserve cart behavior: each test can only be added once.
        3. Preserve current pricing behavior.
        4. When creating a reservation, preserve selected original test metadata already available in selected test data, including code/name/price.
        5. Do not invent prices or metadata.
        6. Preserve original selected tests separately from extra tests.
        7. Preserve patient fields:
           patient_name, age, gender, phone, address, preferred_at.
        8. Public booking remains unauthenticated.
        9. Preserve duplicate-pending reservation behavior.
        10. Preserve existing UI/UX and mobile responsiveness.
        11. Do not modify API files.
        12. Make the smallest safe production-quality changes.
        13. Run the relevant TypeScript check.

        Actually edit web/app/page.tsx. Do not merely describe changes.
        At the end, print a short summary and validation result.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Nemotron Ultra
        run: |
          set -euo pipefail
          timeout 720s opencode run             --model "${OPENCODE_MODEL}"             --print-logs             "${AGENT_PROMPT}"

      - name: Clean generated files and validate scope
        run: |
          set -euo pipefail
          rm -f opencode.json
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true

          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^web/app/page.tsx$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Public agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- web/app/page.tsx > /tmp/public-agent.patch
          test -s /tmp/public-agent.patch

      - name: Upload Public patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-public-patch
          path: /tmp/public-agent.patch
          retention-days: 1


  integrate:
    name: Integration - Apply Patches + Full Validation
    needs:
      - api-agent
      - dashboard-agent
      - admin-agent
      - public-agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-api-patch
          path: /tmp/api

      - name: Download Dashboard patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-dashboard-patch
          path: /tmp/dashboard

      - name: Download Admin patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-admin-patch
          path: /tmp/admin

      - name: Download Public patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-public-patch
          path: /tmp/public

      - name: Apply all agent patches
        run: |
          set -euo pipefail

          git apply --check /tmp/api/api-agent.patch
          git apply --check /tmp/dashboard/dashboard-agent.patch
          git apply --check /tmp/admin/admin-agent.patch
          git apply --check /tmp/public/public-agent.patch

          git apply /tmp/api/api-agent.patch
          git apply /tmp/dashboard/dashboard-agent.patch
          git apply /tmp/admin/admin-agent.patch
          git apply /tmp/public/public-agent.patch

          echo "=== Integrated changes ==="
          git diff --stat
          git status --short

      - name: Validate API TypeScript
        working-directory: api
        run: npx tsc --noEmit

      - name: Validate Web TypeScript
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Web
        working-directory: web
        run: npm run build

      - name: Clean generated files
        run: |
          set -euo pipefail
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true

      - name: Final scope check
        run: |
          set -euo pipefail

          bad="$(git status --porcelain | awk '{print $2}' | grep -vE '^(api/src/index\.ts|web/app/admin/page\.tsx|web/app/dashboard/page\.tsx|web/app/page\.tsx)$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Integration produced unexpected files:"
            echo "$bad"
            exit 1
          fi

          echo "Final scope OK."

      - name: Commit integrated changes
        run: |
          set -euo pipefail

          git config user.name "BookingLab Cloud Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             api/src/index.ts             web/app/admin/page.tsx             web/app/dashboard/page.tsx             web/app/page.tsx

          if git diff --cached --quiet; then
            echo "::error::No integrated changes to commit"
            exit 1
          fi

          git commit -m "Implement BookingLab reservation edit consistency"

      - name: Push integrated changes
        run: |
          set -euo pipefail
          git push origin HEAD:main
