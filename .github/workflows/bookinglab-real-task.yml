          opencode --version

      - name: Configure OpenCode
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Admin agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail

          timeout 720s opencode run \
            --model nvidia/nvidia/nemotron-3-ultra-550b-a55b \
            --print-logs \
            "You are Agent 3 for the BookingLab production repository.

Your ONLY allowed source file is:
web/app/admin/page.tsx

Do not modify any other source file.
Do not create new source files.
Do not modify API files.
Do not modify migrations.
Do not modify package files.
Do not modify workflow files.
Do not commit or push anything.

TASK:
Bring the admin reservation details/edit UI into consistency with the current BookingLab reservation model and API.

Requirements:
1. Inspect the existing admin page and API usage before changing anything.
2. Preserve admin authentication and authorization.
3. Admin retains full reservation editing privileges subject to finalized-record protection.
4. Reservation details must correctly display patient address when present.
5. Reservation edit UI must correctly load and save:
   patient_name, age, gender, phone, address, preferred_at.
6. Preserve original_total. The UI must not suggest that editing patient information recalculates historical original pricing.
7. Preserve the distinction between original selected tests and extra tests.
8. Display original test metadata when available without inventing values.
9. Preserve reservation status workflow:
   PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE.
10. There is no CANCELLED status.
11. Preserve assignment behavior and existing role restrictions.
12. Do not change commission calculations.
13. Preserve responsive/mobile behavior.
14. Make the smallest safe production-quality changes.
15. Run the relevant TypeScript check before finishing.

Do not merely describe changes. Actually edit web/app/admin/page.tsx and verify it.

At the end, print a short summary and validation result."

      - name: Validate agent scope
        run: |
          set -euo pipefail
          rm -f opencode.json

          echo "Changed files:"
          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^web/app/admin/page.tsx$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Admin agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: web
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- web/app/admin/page.tsx > /tmp/admin-agent.patch
          test -s /tmp/admin-agent.patch || {
            echo "::error::Admin agent produced no changes"
            exit 1
          }

      - name: Upload Admin patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-admin-patch
          path: /tmp/admin-agent.patch
          retention-days: 1


  public-agent:
    name: "Agent 4 - Public Booking - Nemotron Super"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-super-120b-a12b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-super-120b-a12b": {
                    "name": "nvidia/nemotron-3-super-120b-a12b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Public booking agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail

          timeout 720s opencode run \
            --model nvidia/nvidia/nemotron-3-super-120b-a12b \
            --print-logs \
            "You are Agent 4 for the BookingLab production repository.

Your ONLY allowed source file is:
web/app/page.tsx

Do not modify any other source file.
Do not create new source files.
Do not modify API files.
Do not modify migrations.
Do not modify package files.
Do not modify workflow files.
Do not commit or push anything.

TASK:
Bring the public booking flow into consistency with the current BookingLab reservation test model.

Requirements:
1. Inspect the existing public booking page and API usage before changing anything.
2. Preserve the current test search behavior and do not preload the complete test catalog.
3. Preserve the existing cart behavior: a test can only be added once to a reservation.
4. Preserve current pricing behavior.
5. When creating a reservation, preserve the selected original test metadata needed by the reservation details/edit flow, including test code/name/price when those values already exist in the selected test data.
6. Do not invent test prices or metadata.
7. Preserve the distinction between original selected tests and extra tests.
8. Preserve patient fields already collected by the public booking flow, including:
   patient_name, age, gender, phone, address, preferred_at.
9. Do not add authentication requirements to public booking.
10. Preserve duplicate-pending reservation behavior.
11. Preserve all existing UI/UX and mobile responsiveness unless a change is required for the task.
12. Do not modify API files.
13. Make the smallest safe production-quality changes.
14. Run the relevant TypeScript check before finishing.

Do not merely describe changes. Actually edit web/app/page.tsx and verify it.

At the end, print a short summary and validation result."

      - name: Validate agent scope
        run: |
          set -euo pipefail
          rm -f opencode.json

          echo "Changed files:"
          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^web/app/page.tsx$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Public agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: web
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- web/app/page.tsx > /tmp/public-agent.patch
          test -s /tmp/public-agent.patch || {
            echo "::error::Public agent produced no changes"
            exit 1
          }

      - name: Upload Public patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-public-patch
          path: /tmp/public-agent.patch
          retention-days: 1


  integrate:
    name: "Integration - Apply Patches + Full Validation"
    needs:
      - api-agent
      - dashboard-agent
      - admin-agent
      - public-agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-api-patch
          path: /tmp/api

      - name: Download Dashboard patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-dashboard-patch
          path: /tmp/dashboard

      - name: Download Admin patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-admin-patch
          path: /tmp/admin

      - name: Download Public patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-public-patch
          path: /tmp/public

      - name: Apply all agent patches
        run: |
          set -euo pipefail

          git apply --check /tmp/api/api-agent.patch
          git apply --check /tmp/dashboard/dashboard-agent.patch
          git apply --check /tmp/admin/admin-agent.patch
          git apply --check /tmp/public/public-agent.patch

          git apply /tmp/api/api-agent.patch
          git apply /tmp/dashboard/dashboard-agent.patch
          git apply /tmp/admin/admin-agent.patch
          git apply /tmp/public/public-agent.patch

          echo "=== Combined diff ==="
          git diff --stat
          git status --short

      - name: Validate API TypeScript
        working-directory: api
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Validate Web TypeScript
        working-directory: web
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Build Web
        working-directory: web
        run: |
          set -euo pipefail
          npm run build

      - name: Final scope check
        run: |
          set -euo pipefail

          bad="$(git status --porcelain | awk '{print $2}' | grep -vE '^(api/src/index\.ts|web/app/admin/page\.tsx|web/app/dashboard/page\.tsx|web/app/page\.tsx)$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Integration produced unexpected files:"
            echo "$bad"
            exit 1
          fi

      - name: Commit integrated changes
        run: |
          set -euo pipefail

          git config user.name "BookingLab Cloud Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            api/src/index.ts \
            web/app/admin/page.tsx \
            web/app/dashboard/page.tsx \
            web/app/page.tsx

          if git diff --cached --quiet; then
            echo "::error::No integrated changes to commit"
            exit 1
          fi

          git commit -m "Implement BookingLab reservation edit consistency"

      - name: Push integrated changes
        run: |
          set -euo pipefail
          git push origin HEAD:main
