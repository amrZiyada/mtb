name: BookingLab Real Task

on:
  workflow_dispatch:

concurrency:
  group: bookinglab-real-task
  cancel-in-progress: false

permissions:
  contents: write

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENCODE_VERSION: 1.18.31
  OPENCODE_MODEL: nvidia/nvidia/nemotron-3-ultra-550b-a55b

jobs:

  api-agent:
    name: Agent 1 - API - Nemotron Ultra
    runs-on: ubuntu-latest
    timeout-minutes: 125

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      AGENT_PROMPT: |
        You are Agent 1 for the BookingLab production repository.

        MODEL REQUIREMENT:
        You are Nemotron 3 Ultra.
        Work carefully and make production-quality changes.
        Do not use or invoke another model.

        ALLOWED FILE:
        api/src/index.ts

        You may modify ONLY api/src/index.ts.
        Do not modify, create, delete, rename, or generate any other repository file.
        Do not commit.
        Do not push.

        TASK:
        Review the current BookingLab API implementation and implement the pending
        reservation edit/details consistency work safely.

        Requirements:
        1. Preserve all existing authentication, authorization, CSRF, rate limiting,
           session handling and validation.
        2. Preserve the exact reservation workflow:
           PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
           There is NO CANCELLED status.
        3. Preserve original_total after reservation creation.
           Editing patient/reservation details must never overwrite historical
           original_total.
        4. Authorized reservation edits must correctly handle:
           patient_name, age, gender, phone, address, preferred_at.
        5. Address supplied by an authorized edit must persist correctly.
        6. Preserve original selected tests separately from extra tests.
        7. Preserve existing commission calculations and rules exactly.
        8. Preserve staff edit restrictions and finalized-record protection.
        9. Preserve admin privileges.
        10. Do not change unrelated API behavior.
        11. Inspect the existing implementation before changing it.
        12. Make the smallest safe changes necessary.
        13. Run the relevant TypeScript validation before finishing.

        IMPORTANT:
        Do not solve problems by changing unrelated files.
        Do not create temporary files inside the repository.
        Actually implement the changes; do not merely explain what should be changed.

        At the end, print:
        - files changed
        - concise summary
        - TypeScript validation result

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Nemotron Ultra
        run: |
          set -euo pipefail
          timeout 7200s opencode run             --model "${OPENCODE_MODEL}"             --print-logs             "${AGENT_PROMPT}"

      - name: Validate API scope
        run: |
          set -euo pipefail

          rm -f opencode.json
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true
          git restore --worktree -- web/next-env.d.ts 2>/dev/null || true

          echo "=== API agent status ==="
          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^api/src/index.ts$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::API agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

          echo "API scope OK."

      - name: TypeScript check
        working-directory: api
        run: npx tsc --noEmit --incremental false

      - name: Create API patch
        run: |
          set -euo pipefail
          git diff --binary -- api/src/index.ts > /tmp/api-agent.patch
          test -s /tmp/api-agent.patch

      - name: Upload API patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-api-patch
          path: /tmp/api-agent.patch
          retention-days: 1


  frontend-agent:
    name: Agent 2 - Frontend - Nemotron Ultra
    runs-on: ubuntu-latest
    timeout-minutes: 125

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      AGENT_PROMPT: |
        You are Agent 2 for the BookingLab production repository.

        MODEL REQUIREMENT:
        You are Nemotron 3 Ultra.
        Work carefully and make production-quality changes.
        Do not use or invoke another model.

        ALLOWED FILES:
        web/app/page.tsx
        web/app/dashboard/page.tsx
        web/app/admin/page.tsx

        You may modify ONLY those three files.
        Do not modify, create, delete, rename, or generate any other repository file.
        Do not commit.
        Do not push.

        TASK:
        Review the current BookingLab frontend and implement the pending reservation
        details/edit consistency work across the public booking page, staff dashboard,
        and admin page.

        PUBLIC BOOKING — web/app/page.tsx:
        1. Preserve search-only test loading. Do not preload the complete test catalog.
        2. Preserve the rule that a test can only be added once to a reservation.
        3. Preserve current pricing behavior.
        4. Preserve selected original test metadata already available from search results,
           including code/name/price.
        5. Do not invent prices or metadata.
        6. Preserve original selected tests separately from extra tests.
        7. Preserve patient fields:
           patient_name, age, gender, phone, address, preferred_at.
        8. Preserve duplicate-pending reservation behavior.
        9. Preserve current responsive/mobile UI.

        STAFF DASHBOARD — web/app/dashboard/page.tsx:
        1. Preserve authentication, sessions, roles and permissions.
        2. Reservation details should display address when present.
        3. Reservation edit must correctly load and save:
           patient_name, age, gender, phone, address, preferred_at.
        4. Preserve original selected tests separately from extra tests.
        5. Preserve available original test metadata without inventing values.
        6. Preserve all existing status behavior.
        7. Preserve the authorized assigned DOCTOR/REP CONFIRMED-edit permission.
        8. Do not change commission behavior.
        9. Preserve responsive/mobile UI.

        ADMIN — web/app/admin/page.tsx:
        1. Preserve admin authentication and authorization.
        2. Preserve admin reservation editing privileges and finalized-record protection.
        3. Reservation details should display address when present.
        4. Reservation edit must correctly load and save:
           patient_name, age, gender, phone, address, preferred_at.
        5. Preserve original_total and historical pricing.
        6. Preserve original selected tests separately from extra tests.
        7. Preserve existing test metadata without inventing values.
        8. Preserve the exact workflow:
           PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        9. There is NO CANCELLED status.
        10. Preserve assignment and role restrictions.
        11. Do not change commission behavior.
        12. Preserve responsive/mobile UI.

        GENERAL:
        - Inspect the existing code before changing it.
        - Keep changes minimal and focused.
        - Do not rewrite unrelated components.
        - Do not modify API files.
        - Do not create helper files.
        - Do not install packages.
        - Do not modify package-lock files.
        - Actually implement the changes; do not merely describe them.
        - Run the relevant TypeScript validation before finishing.

        At the end, print:
        - files changed
        - concise summary
        - TypeScript validation result

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        run: |
          set -euo pipefail
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Nemotron Ultra
        run: |
          set -euo pipefail
          timeout 7200s opencode run             --model "${OPENCODE_MODEL}"             --print-logs             "${AGENT_PROMPT}"

      - name: Validate frontend scope
        run: |
          set -euo pipefail

          rm -f opencode.json
          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo
          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true
          git restore --worktree -- web/next-env.d.ts 2>/dev/null || true

          echo "=== Frontend agent status ==="
          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -vE '^(web/app/page\.tsx|web/app/dashboard/page\.tsx|web/app/admin/page\.tsx)$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Frontend agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

          echo "Frontend scope OK."

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit --incremental false

      - name: Create frontend patch
        run: |
          set -euo pipefail
          git diff --binary --             web/app/page.tsx             web/app/dashboard/page.tsx             web/app/admin/page.tsx             > /tmp/frontend-agent.patch

          test -s /tmp/frontend-agent.patch

      - name: Upload frontend patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-frontend-patch
          path: /tmp/frontend-agent.patch
          retention-days: 1


  integrate:
    name: Integration - Validate + Commit
    needs:
      - api-agent
      - frontend-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download API patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-api-patch
          path: /tmp/api

      - name: Download frontend patch
        uses: actions/download-artifact@v5
        with:
          name: bookinglab-frontend-patch
          path: /tmp/frontend

      - name: Verify patches
        run: |
          set -euo pipefail

          git apply --check /tmp/api/api-agent.patch
          git apply --check /tmp/frontend/frontend-agent.patch

          echo "Patch checks passed."

      - name: Apply patches
        run: |
          set -euo pipefail

          git apply /tmp/api/api-agent.patch
          git apply /tmp/frontend/frontend-agent.patch

          echo "=== Integrated changes ==="
          git diff --stat
          git status --short

      - name: Validate API TypeScript
        working-directory: api
        run: npx tsc --noEmit --incremental false

      - name: Validate Web TypeScript
        working-directory: web
        run: npx tsc --noEmit --incremental false

      - name: Build Web
        working-directory: web
        run: npm run build

      - name: Clean generated files
        run: |
          set -euo pipefail

          rm -f api/tsconfig.tsbuildinfo
          rm -f web/tsconfig.tsbuildinfo

          git restore --worktree -- api/package-lock.json web/package-lock.json 2>/dev/null || true
          git restore --worktree -- web/next-env.d.ts 2>/dev/null || true

          echo "=== Final status ==="
          git status --short

      - name: Final scope check
        run: |
          set -euo pipefail

          bad="$(git status --porcelain | awk '{print $2}' | grep -vE '^(api/src/index\.ts|web/app/page\.tsx|web/app/dashboard/page\.tsx|web/app/admin/page\.tsx)$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Unexpected files remain after integration:"
            echo "$bad"
            exit 1
          fi

          echo "Final scope OK."

      - name: Commit
        run: |
          set -euo pipefail

          git config user.name "BookingLab Cloud Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             api/src/index.ts             web/app/page.tsx             web/app/dashboard/page.tsx             web/app/admin/page.tsx

          if git diff --cached --quiet; then
            echo "::error::No changes to commit."
            exit 1
          fi

          git commit -m "Implement BookingLab reservation consistency"

      - name: Push
        run: |
          set -euo pipefail
          git push origin HEAD:main
