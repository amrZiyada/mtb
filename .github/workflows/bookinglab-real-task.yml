        - Do not change pricing.
        - Do not change original_total.
        - Do not change assignment behavior.
        - Do not modify unrelated files.
        - Assigned DOCTOR/REP confirmed-edit behavior must remain intact.

        FIRST inspect the existing implementation.

        If already correct:
        make NO changes and finish immediately.

        If a real defect exists:
        make the smallest necessary change ONLY in:
        web/app/dashboard/page.tsx

