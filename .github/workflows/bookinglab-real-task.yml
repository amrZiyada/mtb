name: BookingLab Real Task - 4 Cloud Agents v3.3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookinglab-real-task
  cancel-in-progress: true

jobs:

  agent-api:
    name: Agent 1 - Nemotron API
    runs-on: ubuntu-latest
    timeout-minutes: 18

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1

      AGENT_PROMPT: |
        You are Agent 1 for the BookingLab project.

        Repository:
        amrZiyada/mtb

        ASSIGNED FILE:
        api/src/index.ts

        TASK:
        Audit the existing BookingLab API patient-address flow.

        Verify that:
        1. Public booking accepts patient address.
        2. Address is stored.
        3. Address is returned.
        4. Authorized reservation editing preserves address.
        5. Editing does not change original_total.

        IMPORTANT RULES:
        - Statuses are EXACTLY:
          PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        - There is NO CANCELLED status.
        - Do not change authentication.
        - Do not change authorization.
        - Do not change roles.
        - Do not change permissions.
        - Do not change commissions.
        - Do not change pricing.
        - Do not change assignment.
        - Do not change original_total semantics.
        - Do not modify unrelated files.

        FIRST inspect the existing code.

        If the current implementation is already correct:
        make NO changes and finish immediately.

        If a real defect exists:
        make only the smallest necessary change in api/src/index.ts.

        Do NOT run tests, builds, or TypeScript validation yourself.
        Do NOT attempt to repair unrelated TypeScript errors.
        Do NOT modify any file other than api/src/index.ts.

        Stop immediately after the required source change is complete.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.31

      - name: Record baseline
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Baseline: $BASE_SHA"

      - name: Run Nemotron
        timeout-minutes: 9
        run: |
          set -euo pipefail

          timeout --foreground 8m opencode run \
            --model "nvidia/nvidia/nemotron-3-ultra-550b-a55b" \
            --print-logs \
            "$AGENT_PROMPT"

      - name: Validate API TypeScript
        working-directory: api
        timeout-minutes: 3
        run: |
          set -euo pipefail
          timeout 150s npm exec --no -- tsc --noEmit --incremental false

      - name: Clean generated files
        run: |
          set -euo pipefail
          find . -name '*.tsbuildinfo' -type f -delete 2>/dev/null || true

      - name: Verify scope and create artifact
        timeout-minutes: 2
        run: |
          set -euo pipefail

          ASSIGNED="api/src/index.ts"

          TRACKED_CHANGED="$(git diff --name-only "$BASE_SHA")"
          UNTRACKED_CHANGED="$(git ls-files --others --exclude-standard)"

          echo "Tracked changes:"
          printf '%s\n' "$TRACKED_CHANGED"

          echo "Untracked files:"
          printf '%s\n' "$UNTRACKED_CHANGED"

          BAD_TRACKED="$(
            printf '%s\n' "$TRACKED_CHANGED" |
            sed '/^$/d' |
            grep -vxF "$ASSIGNED" || true
          )"

          if [ -n "$BAD_TRACKED" ]; then
            echo "ERROR: Changes outside assigned file:"
            printf '%s\n' "$BAD_TRACKED"
            exit 1
          fi

          if [ -n "$UNTRACKED_CHANGED" ]; then
            echo "ERROR: Unexpected untracked files:"
            printf '%s\n' "$UNTRACKED_CHANGED"
            exit 1
          fi

          if git diff --quiet "$BASE_SHA" -- "$ASSIGNED"; then
            echo "NO_CHANGE" > agent.noop
            echo "Agent 1: NO CHANGE"
          else
            git diff "$BASE_SHA" -- "$ASSIGNED" > agent.patch
            test -s agent.patch
            echo "Agent 1: PATCH CREATED"
          fi

      - name: Upload API artifact
        uses: actions/upload-artifact@v6
        with:
          name: bookinglab-agent-1-api
          path: |
            agent.patch
            agent.noop
          if-no-files-found: ignore


