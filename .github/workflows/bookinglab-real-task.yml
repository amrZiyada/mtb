name: BookingLab Real Cloud Agents v3.5

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENCODE_VERSION: 1.18.31

jobs:

  # ============================================================
  # AGENT 1 — Nemotron 3 Ultra — API
  # ============================================================
  agent-api-nemotron:
    name: "Agent 1 - Nemotron Ultra - API"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      NVIDIA_MODEL_ID: nvidia/nemotron-3-ultra-550b-a55b
      OPENCODE_MODEL: nvidia/nvidia/nemotron-3-ultra-550b-a55b
      ASSIGNED_FILE: api/src/index.ts

      AGENT_PROMPT: |
        You are Agent 1 in a controlled BookingLab engineering task.

        ONLY ASSIGNED FILE:
        api/src/index.ts

        TASK:
        Audit the patient address flow in the API and fix only real defects.

        Requirements:
        - Public booking address must be accepted and persisted.
        - Existing booking address must remain intact when edited.
        - Staff/admin booking edits must preserve address unless explicitly changed.
        - Do not recalculate original_total during ordinary booking edits.
        - Do not change statuses.
        - Valid statuses are exactly:
          PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        - There is NO CANCELLED status.
        - Do not change roles, permissions, assignment rules, commissions,
          pricing, authentication, sessions, or unrelated business logic.

        HARD SCOPE:
        - Only modify api/src/index.ts.
        - Do not modify any other source file.
        - Do not modify package files.
        - Do not modify migrations.
        - Do not modify configuration.
        - Do not refactor unrelated code.
        - Do not create tests or documentation.
        - Do not push.
        - Do not create a PR.

        If the implementation is already correct:
        make NO source change and finish immediately.

        If a real defect exists:
        fix only that defect.

        Before finishing, commit only the assigned file with:
        fix: BookingLab API address flow

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record baseline
        run: |
          set -e
          git status --short
          git rev-parse HEAD > /tmp/base_sha

      - name: Install OpenCode
        run: |
          set -e
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: NVIDIA model preflight with retry
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -u

          for attempt in 1 2 3; do
            echo "NVIDIA preflight attempt $attempt/3"

            set +e

            HTTP_CODE="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 30 \
                -o /tmp/nvidia-preflight.json \
                -w "%{http_code}" \
                "$NVIDIA_BASE_URL/chat/completions" \
                -H "Authorization: Bearer $NVIDIA_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\":\"$NVIDIA_MODEL_ID\",
                  \"messages\":[
                    {
                      \"role\":\"user\",
                      \"content\":\"Reply with exactly OK\"
                    }
                  ],
                  \"max_tokens\":4,
                  \"stream\":false
                }"
            )"

            CURL_CODE=$?

            echo "curl exit: $CURL_CODE"
            echo "HTTP: $HTTP_CODE"

            if [ -f /tmp/nvidia-preflight.json ]; then
              cat /tmp/nvidia-preflight.json
            fi

            if [ "$CURL_CODE" -eq 0 ] &&
               { [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; }; then
              echo "NVIDIA model preflight PASSED"
              exit 0
            fi

            if [ "$HTTP_CODE" = "400" ] ||
               [ "$HTTP_CODE" = "401" ] ||
               [ "$HTTP_CODE" = "403" ] ||
               [ "$HTTP_CODE" = "404" ] ||
               [ "$HTTP_CODE" = "422" ]; then
              echo "Permanent NVIDIA API error: HTTP $HTTP_CODE"
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Transient NVIDIA failure. Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "NVIDIA preflight failed after 3 attempts."
          exit 1

      - name: Create OpenCode config
        run: |
          set -e

          cat > opencode.json <<EOF
          {
            "\$schema":"https://opencode.ai/config.json",
            "model":"$OPENCODE_MODEL",
            "provider":{
              "nvidia":{
                "npm":"@ai-sdk/openai-compatible",
                "name":"NVIDIA NIM",
                "options":{
                  "baseURL":"{env:NVIDIA_BASE_URL}",
                  "apiKey":"{env:NVIDIA_API_KEY}"
                },
                "models":{
                  "$NVIDIA_MODEL_ID":{
                    "name":"$NVIDIA_MODEL_ID",
                    "limit":{
                      "context":1000000,
                      "output":16384
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Run Agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e

          timeout --foreground 8m \
            opencode run \
            --model "$OPENCODE_MODEL" \
            --print-logs \
            "$AGENT_PROMPT"

          CODE=$?

          echo "OpenCode exit code: $CODE"

          if [ "$CODE" -eq 124 ]; then
            echo "ERROR: OpenCode timed out."
            git reset --hard HEAD
            exit 124
          fi

          if [ "$CODE" -ne 0 ]; then
            echo "ERROR: OpenCode failed."
            git reset --hard HEAD
            exit "$CODE"
          fi

          exit 0

      - name: Normalize agent result
        run: |
          set -e

          rm -f opencode.json
          find . -name "*.tsbuildinfo" -type f -delete

          BASE_SHA="$(cat /tmp/base_sha)"

          STATUS="$(git status --porcelain --untracked-files=all)"

          echo "Working tree after cleanup:"
          printf '%s\n' "$STATUS"

          OTHER_FILES="$(
            git status --porcelain --untracked-files=all |
            awk '{print substr($0,4)}' |
            grep -v "^${ASSIGNED_FILE}$" || true
          )"

          if [ -n "$OTHER_FILES" ]; then
            echo "ERROR: Agent touched files outside assigned scope:"
            echo "$OTHER_FILES"
            git reset --hard HEAD
            exit 1
          fi

          if git diff --quiet HEAD -- "$ASSIGNED_FILE" &&
             git diff --cached --quiet HEAD -- "$ASSIGNED_FILE"; then
            echo "No uncommitted assigned-file changes."
          else
            echo "Agent changed assigned file without committing."
            git add "$ASSIGNED_FILE"
            git commit -m "fix: BookingLab API address flow"
          fi

          echo "Final changed files:"
          git diff --name-only "$BASE_SHA" HEAD

      - name: Verify scope
        run: |
          set -e

          BASE_SHA="$(cat /tmp/base_sha)"
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [ -n "$CHANGED" ] && [ "$CHANGED" != "$ASSIGNED_FILE" ]; then
            echo "ERROR: Commit contains files outside assigned scope."
            exit 1
          fi

          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "ERROR: Unexpected working tree changes."
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Validate API TypeScript
        run: |
          set -e
          cd api
          npm ci --no-audit --no-fund
          npx tsc --noEmit --incremental false

      - name: Create artifact
        run: |
          set -e

          BASE_SHA="$(cat /tmp/base_sha)"

          if git diff --quiet "$BASE_SHA" HEAD; then
            echo "NO_CHANGE" > agent.noop
          else
            git format-patch -1 HEAD --stdout > agent.patch
          fi

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-api-nemotron
          path: |
            agent.patch
            agent.noop
          if-no-files-found: ignore


