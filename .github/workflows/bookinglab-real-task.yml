name: BookingLab Real Cloud Agents v3.4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENCODE_VERSION: 1.18.31

jobs:

  # ============================================================
  # AGENT 1 — Nemotron 3 Ultra — API
  # ============================================================
  agent-api-nemotron:
    name: "Agent 1 - Nemotron Ultra - API"
    runs-on: ubuntu-latest
    timeout-minutes: 11

    env:
      NVIDIA_MODEL_ID: nvidia/nemotron-3-ultra-550b-a55b
      OPENCODE_MODEL: nvidia/nvidia/nemotron-3-ultra-550b-a55b
      ASSIGNED_FILE: api/src/index.ts

      AGENT_PROMPT: |
        You are Agent 1 in a controlled BookingLab engineering task.

        YOUR ONLY ASSIGNED FILE:
        api/src/index.ts

        YOUR TASK:
        Audit the patient address flow in the API implementation and fix only real defects
        that affect the BookingLab address requirements.

        Requirements:
        - Public booking address must be accepted and persisted.
        - Existing booking address must remain intact when a booking is edited.
        - Staff/admin booking edits must preserve address unless the submitted edit explicitly changes it.
        - Do not recalculate original_total during ordinary booking edits.
        - Do not change booking statuses.
        - Valid statuses are exactly:
          PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        - There is NO CANCELLED status.
        - Do not change roles, permissions, assignment rules, commissions, pricing rules,
          authentication, sessions, or unrelated business logic.

        HARD SCOPE:
        - You may inspect and modify ONLY api/src/index.ts.
        - Do not modify any other source file.
        - Do not modify package files.
        - Do not modify migrations.
        - Do not modify configuration files.
        - Do not refactor unrelated code.
        - Do not create tests or documentation files.
        - Do not run repair loops.
        - If the implementation is already correct, make NO source change.

        IMPORTANT:
        Work directly and finish quickly.
        Do not spend time exploring unrelated parts of the repository.

        BEFORE FINISHING:
        - If a real defect exists, fix only that defect in api/src/index.ts.
        - If no defect exists, leave the source unchanged.
        - If you changed the file, commit ONLY api/src/index.ts with:
          fix: BookingLab API address flow
        - Do not push.
        - Do not create a PR.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record baseline
        run: |
          git status --short
          git rev-parse HEAD > /tmp/base_sha

      - name: Install OpenCode
        run: |
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: NVIDIA model preflight
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -e
          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ]; do
            CURL_EXIT=0
            HTTP_CODE="$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 45 \
                -o /tmp/nvidia-preflight.json \
                -w "%{http_code}" \
                "$NVIDIA_BASE_URL/chat/completions" \
                -H "Authorization: ******" \
                -H "Content-Type: application/json" \
              -d "{
                \"model\":\"$NVIDIA_MODEL_ID\",
                \"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly OK\"}],
                \"max_tokens\":4,
                \"stream\":false
              }"
            )" || CURL_EXIT=$?

            echo "NVIDIA preflight attempt $ATTEMPT exit: $CURL_EXIT"
            echo "NVIDIA preflight attempt $ATTEMPT HTTP: ${HTTP_CODE:-000}"
            [ -f /tmp/nvidia-preflight.json ] && cat /tmp/nvidia-preflight.json

            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
              break
            fi

            if [ "$CURL_EXIT" -eq 0 ] && [[ "$HTTP_CODE" =~ ^4 ]]; then
              echo "NVIDIA preflight failed with a non-retryable client error."
              exit 1
            fi

            if [ "$ATTEMPT" -eq 3 ]; then
              echo "NVIDIA preflight failed after 3 attempts."
              exit 1
            fi

            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Create OpenCode config
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > opencode.json <<EOF
          {
            "\$schema":"https://opencode.ai/config.json",
            "model":"$OPENCODE_MODEL",
            "provider":{
              "nvidia":{
                "npm":"@ai-sdk/openai-compatible",
                "name":"NVIDIA NIM",
                "options":{
                  "baseURL":"{env:NVIDIA_BASE_URL}",
                  "apiKey":"{env:NVIDIA_API_KEY}"
                },
                "models":{
                  "$NVIDIA_MODEL_ID":{
                    "name":"$NVIDIA_MODEL_ID",
                    "limit":{
                      "context":1000000,
                      "output":16384
                    }
                  }
                }
              }
            }
          }
          EOF

          cat opencode.json

      - name: Run Agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          timeout --foreground 8m \
            opencode run \
            --model "$OPENCODE_MODEL" \
            --print-logs \
            "$AGENT_PROMPT"

          CODE=$?
          echo "OpenCode exit code: $CODE"

          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            exit "$CODE"
          fi

          exit 0

      - name: Clean generated TypeScript cache
        run: |
          rm -f opencode.json
          find . -name "*.tsbuildinfo" -type f -delete

      - name: Verify scope
        run: |
          set -e

          BASE_SHA="$(cat /tmp/base_sha)"

          echo "Committed changes:"
          git diff --name-only "$BASE_SHA" HEAD

          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"

          if [ -n "$CHANGED" ]; then
            if [ "$CHANGED" != "$ASSIGNED_FILE" ]; then
              echo "ERROR: Agent modified files outside assigned scope."
              echo "$CHANGED"
              exit 1
            fi
          fi

          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "ERROR: Unexpected untracked/modified files:"
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Validate API TypeScript
        run: |
          set -e
          cd api
          npm ci --no-audit --no-fund
          npx tsc --noEmit --incremental false

      - name: Create artifact
        run: |
          set -e

          BASE_SHA="$(cat /tmp/base_sha)"

          if git diff --quiet "$BASE_SHA" HEAD; then
            echo "NO_CHANGE" > agent.noop
          else
            git format-patch -1 HEAD --stdout > agent.patch
          fi

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-api-nemotron
          path: |
            agent.patch
            agent.noop
          if-no-files-found: ignore


