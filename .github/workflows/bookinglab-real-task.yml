name: BookingLab Real Task - 4 Cloud Agents v3.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookinglab-real-task
  cancel-in-progress: true

jobs:

  agent-api:
    name: Agent 1 - Nemotron API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      AGENT_PROMPT: |
        You are Agent 1 for the BookingLab project.

        Repository:
        amrZiyada/mtb

        Assigned file:
        api/src/index.ts

        TASK:
        Audit the current BookingLab API implementation for the patient address flow.

        The patient address must:
        1. Be accepted from public booking creation.
        2. Be stored on the reservation.
        3. Be returned by the API.
        4. Be preserved when an authorized staff member edits a reservation.
        5. Not alter original_total during reservation editing.

        IMPORTANT BOOKINGLAB RULES:
        - Reservation statuses are EXACTLY:
          PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        - There is NO CANCELLED status.
        - Do not change status behavior.
        - Do not change authentication or authorization boundaries.
        - Do not change roles or permissions.
        - Do not change commission calculations.
        - Do not change assignment rules.
        - Do not change pricing behavior.
        - Do not change original_total semantics.
        - Do not modify unrelated files.
        - Do not refactor unrelated code.

        FIRST inspect the existing implementation carefully.

        If the current implementation already satisfies the task:
        - Make NO source-code changes.
        - Do NOT create a commit.
        - Finish successfully.

        If a real defect exists:
        - Make the smallest safe change necessary.
        - Modify ONLY api/src/index.ts.
        - Do not create speculative improvements.
        - Do not rewrite the file.

        Ensure the final assigned file is valid TypeScript.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.31

      - name: Record baseline
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Baseline: $BASE_SHA"

      - name: Run Nemotron
        timeout-minutes: 10
        run: |
          set -euo pipefail

          timeout 8m opencode run \
            --model "nvidia/nvidia/nemotron-3-ultra-550b-a55b" \
            --print-logs \
            "$AGENT_PROMPT"

      - name: Validate API TypeScript
        working-directory: api
        timeout-minutes: 3
        run: |
          set -euo pipefail
          timeout 150s npm exec --no -- tsc --noEmit --incremental false

      - name: Verify scope and create artifact
        timeout-minutes: 2
        run: |
          set -euo pipefail

          ASSIGNED="api/src/index.ts"

          TRACKED_CHANGED="$(git diff --name-only "$BASE_SHA")"
          UNTRACKED_CHANGED="$(git ls-files --others --exclude-standard)"

          echo "Tracked changes:"
          if [ -n "$TRACKED_CHANGED" ]; then
            printf '%s\n' "$TRACKED_CHANGED"
          else
            echo "NONE"
          fi

          echo "Untracked files:"
          if [ -n "$UNTRACKED_CHANGED" ]; then
            printf '%s\n' "$UNTRACKED_CHANGED"
          else
            echo "NONE"
          fi

          BAD_TRACKED="$(
            printf '%s\n' "$TRACKED_CHANGED" |
            sed '/^$/d' |
            grep -vxF "$ASSIGNED" || true
          )"

          if [ -n "$BAD_TRACKED" ]; then
            echo "ERROR: Agent changed files outside assigned scope:"
            printf '%s\n' "$BAD_TRACKED"
            exit 1
          fi

          if [ -n "$UNTRACKED_CHANGED" ]; then
            echo "ERROR: Agent created untracked files:"
            printf '%s\n' "$UNTRACKED_CHANGED"
            exit 1
          fi

          if git diff --quiet "$BASE_SHA" -- "$ASSIGNED"; then
            echo "NO_CHANGE" > agent.noop
            echo "Agent 1: NO CHANGE"
          else
            git diff "$BASE_SHA" -- "$ASSIGNED" > agent.patch
            test -s agent.patch
            echo "Agent 1: PATCH CREATED"
          fi

      - name: Upload API artifact
        uses: actions/upload-artifact@v6
        with:
          name: bookinglab-agent-1-api
          path: |
            agent.patch
            agent.noop
          if-no-files-found: ignore


