name: BookingLab Real Task

on:
  workflow_dispatch:

concurrency:
  group: bookinglab-real-task
  cancel-in-progress: false

permissions:
  contents: read

env:
  NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENCODE_VERSION: 1.18.31

jobs:

  api-agent:
    name: "Agent 1 - API - Nemotron Ultra"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-ultra-550b-a55b": {
                    "name": "nvidia/nemotron-3-ultra-550b-a55b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run API agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail

          timeout 720s opencode run \
            --model nvidia/nvidia/nemotron-3-ultra-550b-a55b \
            --print-logs \
            "You are Agent 1 for the BookingLab production repository.

Your ONLY allowed source file is:
api/src/index.ts

Do not modify any other source file.
Do not create new source files.
Do not modify migrations.
Do not modify package files.
Do not modify workflow files.
Do not commit or push anything.

TASK:
Implement and verify the pending BookingLab reservation-edit/details consistency work in api/src/index.ts.

Requirements:
1. Preserve the existing BookingLab business rules and authentication/authorization.
2. Reservation status workflow remains EXACTLY:
   PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
   There is NO CANCELLED status.
3. Preserve original_total once a reservation has been created. Editing a reservation must NOT silently recalculate or overwrite original_total.
4. Reservation editing must correctly preserve/update the editable patient data already supported by the application, including:
   patient_name, age, gender, phone, address, preferred_at.
5. Address must be accepted and persisted when an authorized edit supplies it.
6. Original selected tests must remain represented correctly when a reservation is edited. Do not confuse original tests with extra tests.
7. Extra tests remain separate from the original reservation tests and must not change commission rules.
8. Preserve all existing commission/business logic.
9. Preserve staff edit restrictions and finalized-record protection.
10. Preserve admin privileges.
11. Do not weaken authentication, authorization, CSRF, rate limiting, session handling, or input validation.
12. Inspect the existing code first and make the smallest safe production-quality changes necessary.
13. Fix any TypeScript errors caused by your changes.
14. Run the relevant TypeScript check before finishing.

Do not merely describe the changes. Actually edit api/src/index.ts and verify it.

At the end, print a short summary of what you changed and the validation command/result."

      - name: Validate agent scope
        run: |
          set -euo pipefail
          rm -f opencode.json

          echo "Changed files:"
          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^api/src/index.ts$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::API agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: api
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- api/src/index.ts > /tmp/api-agent.patch
          test -s /tmp/api-agent.patch || {
            echo "::error::API agent produced no changes"
            exit 1
          }

      - name: Upload API patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-api-patch
          path: /tmp/api-agent.patch
          retention-days: 1


  dashboard-agent:
    name: "Agent 2 - Dashboard - Nemotron Super"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          opencode --version

      - name: Configure OpenCode
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia/nvidia/nemotron-3-super-120b-a12b",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nemotron-3-super-120b-a12b": {
                    "name": "nvidia/nemotron-3-super-120b-a12b",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          JSON

      - name: Run Dashboard agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ env.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail

          timeout 720s opencode run \
            --model nvidia/nvidia/nemotron-3-super-120b-a12b \
            --print-logs \
            "You are Agent 2 for the BookingLab production repository.

Your ONLY allowed source file is:
web/app/dashboard/page.tsx

Do not modify any other source file.
Do not create new source files.
Do not modify API files.
Do not modify migrations.
Do not modify package files.
Do not modify workflow files.
Do not commit or push anything.

TASK:
Bring the staff dashboard reservation details/edit UI into consistency with the current BookingLab reservation model and API.

Requirements:
1. Inspect the existing dashboard code and API usage before changing anything.
2. Preserve the existing staff authentication/session flow.
3. Preserve role and permission behavior.
4. Staff users must only see/edit data that the API already authorizes.
5. Reservation details must correctly display the patient address when present.
6. Reservation edit UI must correctly load and save:
   patient_name, age, gender, phone, address, preferred_at.
7. Preserve the distinction between original selected tests and extra tests.
8. Display original test metadata when available without inventing values.
9. Preserve existing reservation status behavior.
10. Preserve the special permission allowing an assigned DOCTOR/REP to edit a CONFIRMED reservation when the API authorizes it.
11. Do not introduce client-side permission bypasses.
12. Do not alter commission calculations.
13. Keep the existing responsive/mobile UI behavior.
14. Make the smallest safe production-quality changes.
15. Run the relevant TypeScript check before finishing.

Do not merely describe changes. Actually edit web/app/dashboard/page.tsx and verify it.

At the end, print a short summary and validation result."

      - name: Validate agent scope
        run: |
          set -euo pipefail
          rm -f opencode.json

          echo "Changed files:"
          git status --short

          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^web/app/dashboard/page.tsx$' || true)"

          if [ -n "$bad" ]; then
            echo "::error::Dashboard agent modified files outside its allowed scope:"
            echo "$bad"
            exit 1
          fi

      - name: TypeScript check
        working-directory: web
        run: |
          set -euo pipefail
          npx tsc --noEmit

      - name: Create patch
        run: |
          set -euo pipefail
          git diff --binary -- web/app/dashboard/page.tsx > /tmp/dashboard-agent.patch
          test -s /tmp/dashboard-agent.patch || {
            echo "::error::Dashboard agent produced no changes"
            exit 1
          }

      - name: Upload Dashboard patch
        uses: actions/upload-artifact@v4
        with:
          name: bookinglab-dashboard-patch
          path: /tmp/dashboard-agent.patch
          retention-days: 1


