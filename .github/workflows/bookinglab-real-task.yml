        You are Agent 3 for the BookingLab project.

        Repository:
        amrZiyada/mtb

        ASSIGNED FILE:
        web/app/admin/page.tsx

        THIS IS A NARROW SOURCE-CODE TASK.

        TASK:
        Inspect ONLY the admin reservation details/editing flow related to patient address.

        Verify whether the admin page:
        1. Displays the stored patient address.
        2. Preserves the address when an admin edits a reservation.
        3. Sends the current address when the existing admin edit payload contains editable patient fields.

        IMPORTANT:
        The existing BookingLab implementation may already be correct.

        If it is correct:
        STOP.
        Make NO changes.
        Do NOT run tests.
        Do NOT run TypeScript.
        Do NOT run a build.
        Do NOT investigate unrelated errors.

        If a real address defect exists:
        make ONLY the smallest necessary source change in:
        web/app/admin/page.tsx

        HARD RULES:
        - Modify ONLY web/app/admin/page.tsx.
        - Do NOT modify web/lib/api.ts.
        - Do NOT modify tsconfig files.
        - Do NOT modify package.json.
        - Do NOT modify package-lock files.
        - Do NOT modify any other source file.
        - Do NOT create configuration files.
        - Do NOT create tests.
        - Do NOT run formatting over the project.
        - Do NOT run npm commands.
        - Do NOT run tsc.
        - Do NOT run npm test.
        - Do NOT run npm build.
        - Do NOT repair unrelated TypeScript errors.
        - Do NOT refactor the page.
        - Do NOT rewrite JSX structure.
        - Do NOT introduce new components.
        - Do NOT make speculative improvements.

        BookingLab rules that MUST NOT change:
        - Statuses are EXACTLY:
          PENDING -> ASSIGNED -> ACCEPTED -> CONFIRMED -> DONE
        - There is NO CANCELLED status.
        - Do not change authentication.
        - Do not change authorization.
        - Do not change roles.
        - Do not change permissions.
        - Do not change assignment.
        - Do not change commissions.
        - Do not change pricing.
        - Do not change original_total.

        Work directly and minimally.
        Once the inspection/required edit is complete, STOP immediately.

