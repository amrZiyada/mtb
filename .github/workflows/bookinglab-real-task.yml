      - name: Run Agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          timeout --foreground 8m \
            opencode run \
            --model "$OPENCODE_MODEL" \
            --print-logs \
            "$AGENT_PROMPT"

          CODE=$?
          echo "OpenCode exit code: $CODE"

          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            exit "$CODE"
          fi

          exit 0

      - name: Clean generated TypeScript cache
        run: |
          rm -f opencode.json
          find . -name "*.tsbuildinfo" -type f -delete

      - name: Verify scope
        run: |
          set -e

          BASE_SHA="$(cat /tmp/base_sha)"
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if [ -n "$CHANGED" ] && [ "$CHANGED" != "$ASSIGNED_FILE" ]; then
            echo "ERROR: Agent modified files outside assigned scope."
            exit 1
          fi

          if [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "ERROR: Unexpected untracked/modified files:"
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Validate Web TypeScript
        run: |
          set -e
          cd web
          npm ci --no-audit --no-fund
          npx tsc --noEmit --incremental false

      - name: Create artifact
        run: |
          set -e
          BASE_SHA="$(cat /tmp/base_sha)"

          if git diff --quiet "$BASE_SHA" HEAD; then
            echo "NO_CHANGE" > agent.noop
          else
            git format-patch -1 HEAD --stdout > agent.patch
          fi

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-public-glm
          path: |
            agent.patch
            agent.noop
          if-no-files-found: ignore
