name: Multi-Agent Coding Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding-agents:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        include:
          - agent: "Agent 1 - Nemotron"
            model: "nvidia/nemotron-3-ultra-550b-a55b"
            model_key: "nemotron-3-ultra-550b-a55b"
            branch: "cloud-test/nemotron"
            test_file: ".cloud-agent-tests/nemotron.md"

          - agent: "Agent 2 - GLM-5.3"
            model: "nvidia/z-ai/glm-5.3"
            model_key: "z-ai/glm-5.3"
            branch: "cloud-test/glm-5-3"
            test_file: ".cloud-agent-tests/glm-5-3.md"

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Create isolated local branch
        run: |
          git switch -c "${{ matrix.branch }}"

          echo "========================================"
          echo "AGENT: ${{ matrix.agent }}"
          echo "MODEL: ${{ matrix.model }}"
          echo "BRANCH: ${{ matrix.branch }}"
          echo "TEST FILE: ${{ matrix.test_file }}"
          echo "========================================"

          git branch --show-current

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@1.18.31
          opencode --version

      - name: Create OpenCode configuration
        run: |
          mkdir -p .opencode-test

          cat > opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "model": "${{ matrix.model }}",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "${{ matrix.model_key }}": {
                    "name": "${{ matrix.model }}",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          EOF

          echo "OpenCode configuration created."

      - name: Prepare isolated test task
        run: |
          mkdir -p .cloud-agent-tests

          cat > agent-task.md <<EOF
          You are ${{ matrix.agent }}.

          This is a SAFE CLOUD CODING TEST.

          Your ONLY allowed production-side modification is:

          ${{ matrix.test_file }}

          You may create that file if it does not exist.

          DO NOT modify:
          - api/
          - web/
          - package.json
          - package-lock.json
          - wrangler configuration
          - database migrations
          - deployment configuration
          - GitHub workflows
          - any existing application source file

          TASK:

          Create or update the file:

          ${{ matrix.test_file }}

          The file must contain a short Markdown report with:

          1. Your agent/model identity.
          2. Confirmation that you are running inside GitHub Actions.
          3. The current git branch.
          4. A short description of BookingLab architecture based on repository inspection.
          5. A timestamp generated by the shell.
          6. A final line:

          CLOUD CODING AGENT TEST PASSED

          You MUST:
          - inspect the repository before editing
          - make the requested file
          - verify the file exists
          - review your git diff
          - create a local git commit

          You MUST NOT:
          - push anything
          - create a pull request
          - modify main
          - modify any other application file
          - deploy anything

          After committing, report the commit hash.

          Finish your response with exactly:

          CLOUD CODING AGENT COMPLETE
          EOF

      - name: Run OpenCode coding agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
        run: |
          echo "========================================"
          echo "STARTING CODING AGENT"
          echo "Agent: ${{ matrix.agent }}"
          echo "Model: ${{ matrix.model }}"
          echo "Branch: ${{ matrix.branch }}"
          echo "========================================"

          opencode run \
            --model "${{ matrix.model }}" \
            --print-logs \
            "$(cat agent-task.md)"

      - name: Verify agent changes
        run: |
          echo "========================================"
          echo "BRANCH"
          echo "========================================"
          git branch --show-current

          echo
          echo "========================================"
          echo "STATUS"
          echo "========================================"
          git status --short

          echo
          echo "========================================"
          echo "DIFF"
          echo "========================================"
          git diff HEAD~1 HEAD -- "${{ matrix.test_file }}" || true

          echo
          echo "========================================"
          echo "TEST FILE"
          echo "========================================"
          cat "${{ matrix.test_file }}"

          echo
          echo "========================================"
          echo "LATEST COMMIT"
          echo "========================================"
          git log -1 --oneline

          echo
          echo "========================================"
          echo "VERIFYING COMMIT"
          echo "========================================"

          if ! git log -1 --pretty=%B | grep -q "CLOUD CODING AGENT TEST"; then
            echo "ERROR: Expected coding-agent commit was not created."
            exit 1
          fi

          echo "CODING AGENT VERIFICATION PASSED"

      - name: Create patch artifact
        run: |
          git format-patch -1 HEAD --stdout > "${{ matrix.agent }}.patch"

          echo "Patch created:"
          ls -lh "${{ matrix.agent }}.patch"

      - name: Upload agent patch
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.agent }}-patch
          path: "${{ matrix.agent }}.patch"
          if-no-files-found: error
