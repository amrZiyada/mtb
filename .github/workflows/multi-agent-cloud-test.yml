name: GLM Cloud Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glm-agents:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - agent: "Agent 3 - GLM-5.3"
            model: "z-ai/glm-5-3"

          - agent: "Agent 4 - GLM-5.3-Flash"
            model: "z-ai/glm-5-3-flash"

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Test NVIDIA GLM model directly
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ matrix.model }}
        run: |
          echo "========================================"
          echo "Agent: ${{ matrix.agent }}"
          echo "NVIDIA model: $NVIDIA_MODEL"
          echo "========================================"

          HTTP_STATUS=$(curl -sS \
            -o nvidia-response.json \
            -w "%{http_code}" \
            --max-time 120 \
            -X POST \
            "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$NVIDIA_MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Reply with exactly: GLM MODEL TEST OK\"
                }
              ],
              \"max_tokens\": 20,
              \"stream\": false
            }")

          echo
          echo "HTTP_STATUS=$HTTP_STATUS"
          echo
          echo "NVIDIA RESPONSE:"
          cat nvidia-response.json
          echo

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo
            echo "GLM MODEL TEST FAILED"
            exit 1
          fi

          echo
          echo "GLM MODEL TEST PASSED"
