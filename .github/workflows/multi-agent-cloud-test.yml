name: NVIDIA Model Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover NVIDIA Models
    runs-on: ubuntu-latest

    steps:
      - name: Query NVIDIA model catalog
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "========================================"
          echo "NVIDIA MODELS AVAILABLE TO THIS API KEY"
          echo "========================================"

          HTTP_STATUS=$(curl -sS \
            -o models.json \
            -w "%{http_code}" \
            --max-time 60 \
            -X GET \
            "https://integrate.api.nvidia.com/v1/models" \
            -H "Authorization: Bearer $NVIDIA_API_KEY")

          echo
          echo "HTTP_STATUS=$HTTP_STATUS"
          echo

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "NVIDIA MODEL LIST FAILED"
            cat models.json
            exit 1
          fi

          echo "GLM MODELS:"
          python - <<'PY'
          import json

          with open("models.json") as f:
              data = json.load(f)

          models = data.get("data", [])

          found = []

          for item in models:
              model_id = item.get("id", "")
              if "glm" in model_id.lower():
                  found.append(model_id)

          if found:
              for model in found:
                  print("  " + model)
          else:
              print("  No GLM models returned for this API key.")

          print()
          print("TOTAL MODELS RETURNED:", len(models))
          PY

          echo
          echo "========================================"
          echo "NEMOTRON / DEEPSEEK CHECK"
          echo "========================================"

          python - <<'PY'
          import json

          with open("models.json") as f:
              data = json.load(f)

          for item in data.get("data", []):
              model = item.get("id", "")
              low = model.lower()

              if "nemotron" in low or "deepseek" in low:
                  print(model)
          PY
