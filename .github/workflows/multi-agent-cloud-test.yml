name: GLM Direct Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glm:
    name: GLM-5.3-Flash
    runs-on: ubuntu-latest

    steps:
      - name: Test GLM-5.3-Flash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "Testing z-ai/glm-5-3-flash..."

          curl -sS \
            --max-time 180 \
            -X POST \
            "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "z-ai/glm-5-3-flash",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: GLM TEST OK"
                }
              ]
            }' \
            | tee glm-response.json

          echo
          echo "========================================"
          echo "GLM TEST COMPLETE"
          echo "========================================"
