name: BookingLab 4-Agent Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding-agents:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4

      matrix:
        include:
          - agent: "Agent 1 - Nemotron - API"
            model: "nvidia/nvidia/nemotron-3-ultra-550b-a55b"
            model_key: "nvidia/nemotron-3-ultra-550b-a55b"
            display_model: "Nemotron 3 Ultra 550B"
            branch: "cloud-test/api-nemotron"
            target_file: "api/src/index.ts"

          - agent: "Agent 2 - GLM-5.3 - Dashboard"
            model: "nvidia/z-ai/glm-5.3"
            model_key: "z-ai/glm-5.3"
            display_model: "GLM-5.3"
            branch: "cloud-test/dashboard-glm"
            target_file: "web/app/dashboard/page.tsx"

          - agent: "Agent 3 - Nemotron - Admin"
            model: "nvidia/nvidia/nemotron-3-ultra-550b-a55b"
            model_key: "nvidia/nemotron-3-ultra-550b-a55b"
            display_model: "Nemotron 3 Ultra 550B"
            branch: "cloud-test/admin-nemotron"
            target_file: "web/app/admin/page.tsx"

          - agent: "Agent 4 - GLM-5.3 - Public"
            model: "nvidia/z-ai/glm-5.3"
            model_key: "z-ai/glm-5.3"
            display_model: "GLM-5.3"
            branch: "cloud-test/public-glm"
            target_file: "web/app/page.tsx"

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Create isolated branch
        run: |
          git switch -c "${{ matrix.branch }}"

          echo "========================================"
          echo "BOOKINGLAB 4-AGENT TEST"
          echo "========================================"
          echo "Agent:        ${{ matrix.agent }}"
          echo "Model:        ${{ matrix.display_model }}"
          echo "Branch:       ${{ matrix.branch }}"
          echo "Target file:  ${{ matrix.target_file }}"
          echo "========================================"

          git branch --show-current

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@1.18.31
          opencode --version

      - name: Create OpenCode configuration
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/nemotron-3-ultra-550b-a55b": {
                    "name": "Nemotron 3 Ultra 550B",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  },
                  "z-ai/glm-5.3": {
                    "name": "GLM-5.3",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Prepare coding task
        run: |
          cat > agent-task.md <<EOF
          You are ${{ matrix.agent }}.

          This is a SAFE BookingLab isolation test.

          Your assigned file is EXACTLY:

          ${{ matrix.target_file }}

          You MUST inspect the repository and the assigned file before editing.

          YOUR ONLY ALLOWED SOURCE FILE TO MODIFY IS:

          ${{ matrix.target_file }}

          Do NOT modify any other tracked file.

          Do NOT modify:
          - any other file under api/
          - any other file under web/
          - package.json
          - package-lock.json
          - tsconfig files
          - wrangler files
          - database migrations
          - GitHub workflows
          - configuration files
          - tests outside the assigned file

          TASK:

          Make ONE harmless, clearly reversible change to the assigned file.

          Add exactly one short comment indicating that this file was inspected
          by the BookingLab cloud coding-agent isolation test.

          The comment must NOT change application behavior.

          Use the correct comment syntax for the file.

          Do NOT refactor.
          Do NOT reformat unrelated code.
          Do NOT change logic.
          Do NOT fix unrelated issues.
          Do NOT add dependencies.

          After the change:

          1. Inspect git diff.
          2. Confirm ONLY the assigned file changed.
          3. Verify the comment exists.
          4. Create a LOCAL git commit.
          5. Commit ONLY the assigned file.

          Do NOT push.
          Do NOT create a pull request.
          Do NOT deploy.
          Do NOT modify main.

          Commit message should be:

          BookingLab cloud agent isolation test

          Finish your response with exactly:

          BOOKINGLAB AGENT ISOLATION TEST COMPLETE
          EOF

      - name: Run OpenCode coding agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
        run: |
          echo "========================================"
          echo "STARTING OPENCode"
          echo "Agent: ${{ matrix.agent }}"
          echo "Model: ${{ matrix.display_model }}"
          echo "Target: ${{ matrix.target_file }}"
          echo "========================================"

          opencode run \
            --model "${{ matrix.model }}" \
            --print-logs \
            "$(cat agent-task.md)"

      - name: Verify strict file isolation
        run: |
          echo "========================================"
          echo "VERIFYING FILE ISOLATION"
          echo "========================================"

          echo
          echo "Current branch:"
          git branch --show-current

          echo
          echo "Latest commit:"
          git log -1 --oneline

          echo
          echo "Committed files:"
          git diff-tree --no-commit-id --name-only -r HEAD

          EXPECTED="${{ matrix.target_file }}"

          COMMITTED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)

          if [ "$COMMITTED_FILES" != "$EXPECTED" ]; then
            echo
            echo "ERROR: Agent modified or committed an unauthorized file."
            echo
            echo "Expected only:"
            echo "$EXPECTED"
            echo
            echo "Actually committed:"
            echo "$COMMITTED_FILES"
            exit 1
          fi

          echo
          echo "Commit contains ONLY the assigned file."

          echo
          echo "Checking working tree:"
          git status --short

          echo
          echo "Checking assigned file:"
          test -f "$EXPECTED"

          grep -q "BookingLab cloud coding-agent isolation test" "$EXPECTED"

          echo
          echo "Required isolation-test comment found."

          echo
          echo "========================================"
          echo "ISOLATION TEST PASSED"
          echo "========================================"

      - name: Run targeted syntax check
        run: |
          echo "========================================"
          echo "TARGETED VALIDATION"
          echo "========================================"

          case "${{ matrix.target_file }}" in
            api/src/index.ts)
              cd api
              npx tsc --noEmit
              ;;

            web/app/dashboard/page.tsx)
              cd web
              npx tsc --noEmit
              ;;

            web/app/admin/page.tsx)
              cd web
              npx tsc --noEmit
              ;;

            web/app/page.tsx)
              cd web
              npx tsc --noEmit
              ;;
          esac

          echo
          echo "TARGETED VALIDATION PASSED"

      - name: Create patch artifact
        run: |
          git format-patch -1 HEAD --stdout \
            > "${{ matrix.agent }}.patch"

          ls -lh "${{ matrix.agent }}.patch"

      - name: Upload agent patch
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.agent }}-patch
          path: "${{ matrix.agent }}.patch"
          if-no-files-found: error
