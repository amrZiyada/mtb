name: Multi-Agent Coding Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding-agents:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        include:
          - agent: "Agent 1 - Nemotron"
            model: "nvidia/nvidia/nemotron-3-ultra-550b-a55b"
            model_key: "nvidia/nemotron-3-ultra-550b-a55b"
            display_model: "Nemotron 3 Ultra 550B"
            branch: "cloud-test/nemotron"
            test_file: ".cloud-agent-tests/nemotron.md"

          - agent: "Agent 2 - GLM-5.3"
            model: "nvidia/z-ai/glm-5.3"
            model_key: "z-ai/glm-5.3"
            display_model: "GLM-5.3"
            branch: "cloud-test/glm-5-3"
            test_file: ".cloud-agent-tests/glm-5-3.md"

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Create isolated local branch
        run: |
          git switch -c "${{ matrix.branch }}"

          echo "========================================"
          echo "AGENT: ${{ matrix.agent }}"
          echo "MODEL: ${{ matrix.display_model }}"
          echo "BRANCH: ${{ matrix.branch }}"
          echo "TEST FILE: ${{ matrix.test_file }}"
          echo "========================================"

          git branch --show-current

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@1.18.31
          opencode --version

      - name: Create OpenCode configuration
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "{env:NVIDIA_BASE_URL}",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/nemotron-3-ultra-550b-a55b": {
                    "name": "Nemotron 3 Ultra 550B",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  },
                  "z-ai/glm-5.3": {
                    "name": "GLM-5.3",
                    "limit": {
                      "context": 1000000,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          EOF

          echo "OpenCode configuration created."

      - name: Prepare isolated test task
        run: |
          mkdir -p .cloud-agent-tests

          cat > agent-task.md <<EOF
          You are ${{ matrix.agent }}.

          This is a SAFE CLOUD CODING TEST.

          Your ONLY allowed application-side modification is:

          ${{ matrix.test_file }}

          You may create that file if it does not exist.

          DO NOT modify:
          - api/
          - web/
          - package.json
          - package-lock.json
          - wrangler configuration
          - database migrations
          - deployment configuration
          - GitHub workflows
          - any existing application source file

          TASK:

          1. Inspect the repository.
          2. Create or update:
             ${{ matrix.test_file }}
          3. The Markdown file must contain:
             - Agent/model identity: ${{ matrix.display_model }}
             - Confirmation that it is running inside GitHub Actions
             - Current git branch
             - Short BookingLab architecture description
             - A shell-generated timestamp
             - Final line:
               CLOUD CODING AGENT TEST PASSED
          4. Verify the file exists.
          5. Review git diff.
          6. Commit ONLY the requested test file.

          Do NOT:
          - push anything
          - create a pull request
          - modify main
          - modify any application source file
          - deploy anything

          Create a local git commit containing ONLY:
          ${{ matrix.test_file }}

          After committing, report the commit hash.

          Finish with exactly:

          CLOUD CODING AGENT COMPLETE
          EOF

      - name: Run OpenCode coding agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
        run: |
          echo "========================================"
          echo "STARTING CODING AGENT"
          echo "Agent: ${{ matrix.agent }}"
          echo "Model: ${{ matrix.display_model }}"
          echo "Branch: ${{ matrix.branch }}"
          echo "========================================"

          opencode run \
            --model "${{ matrix.model }}" \
            --print-logs \
            "$(cat agent-task.md)"

      - name: Verify agent changes
        run: |
          echo "========================================"
          echo "BRANCH"
          echo "========================================"
          git branch --show-current

          echo
          echo "========================================"
          echo "STATUS"
          echo "========================================"
          git status --short

          echo
          echo "========================================"
          echo "LATEST COMMIT"
          echo "========================================"
          git log -1 --oneline

          echo
          echo "========================================"
          echo "FILES IN AGENT COMMIT"
          echo "========================================"

          git diff-tree --no-commit-id --name-only -r HEAD

          echo
          echo "========================================"
          echo "VERIFYING COMMIT CONTENT"
          echo "========================================"

          COMMITTED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)

          EXPECTED="${{ matrix.test_file }}"

          if [ "$COMMITTED_FILES" != "$EXPECTED" ]; then
            echo "ERROR: Agent commit contains unexpected files."
            echo "Expected:"
            echo "$EXPECTED"
            echo
            echo "Actual:"
            echo "$COMMITTED_FILES"
            exit 1
          fi

          echo "Commit contains exactly the allowed test file."

          echo
          echo "========================================"
          echo "TEST FILE"
          echo "========================================"

          test -f "${{ matrix.test_file }}"

          cat "${{ matrix.test_file }}"

          echo
          echo "========================================"
          echo "VERIFYING TEST CONTENT"
          echo "========================================"

          grep -q "CLOUD CODING AGENT TEST PASSED" "${{ matrix.test_file }}"

          echo "Required test content found."

          echo
          echo "========================================"
          echo "CODING AGENT VERIFICATION PASSED"
          echo "========================================"

      - name: Create patch artifact
        run: |
          git format-patch -1 HEAD --stdout > "${{ matrix.agent }}.patch"

          echo "Patch created:"
          ls -lh "${{ matrix.agent }}.patch"

      - name: Upload agent patch
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.agent }}-patch
          path: "${{ matrix.agent }}.patch"
          if-no-files-found: error
